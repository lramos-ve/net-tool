services:
  db:
    image: postgres:16-alpine
    container_name: net-tool-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netmonitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netmonitor}
      POSTGRES_DB: ${POSTGRES_DB:-net_monitor}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netmonitor} -d ${POSTGRES_DB:-net_monitor}"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build: .
    container_name: net-tool-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    cap_add:
      - NET_RAW
    environment:
      NET_MONITOR_CONFIG: /app/config.json
    volumes:
      - ./config.json:/app/config.json:ro
    command: ["python", "-m", "app.main", "--config", "/app/config.json"]

  web:
    build: .
    container_name: net-tool-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    cap_add:
      - NET_RAW
    ports:
      - "8080:8080"
    environment:
      NET_MONITOR_CONFIG: /app/config.json
    volumes:
      - ./config.json:/app/config.json:ro
    command:
      [
        "streamlit",
        "run",
        "app/dashboard.py",
        "--server.address",
        "0.0.0.0",
        "--server.port",
        "8080",
        "--server.headless",
        "true",
      ]

volumes:
  pgdata:
